name: release
on:
  release:
    types: [published]
jobs:
  stage:
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm install --global npm@'12.1.0' --ignore-scripts
      - name: Read owner approval
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir .release
          gh release download "$TAG" --pattern approval-signed --dir .release
          node dist/cli/verb.js fold --as release .release/approval-signed > .release/verdict
          cat .release/verdict
      - name: Stage the approved release archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          read -r status digest archive source extra < .release/verdict
          test "$status" = READY
          test -z "$extra"
          gh release download "$TAG" --pattern "$archive" --dir .release
          printf '%s  %s\n' "${digest#sha256:}" ".release/$archive" | sha256sum -c -
          expected="$(node -p "require('./package.json').name+'@'+require('./package.json').version")"
          actual="$(tar -xOf ".release/$archive" package/package.json | node -p "const p=JSON.parse(require('fs').readFileSync(0,'utf8'));p.name+'@'+p.version")"
          test "$actual" = "$expected"
          printf 'SOURCE release/%s/%s · %s · declared %s\n' "$TAG" "$archive" "$digest" "$source"
          npm stage publish ".release/$archive" --access public --ignore-scripts
          printf 'STAGED %s · %s · owner approval pending\n' "$actual" "$digest"
