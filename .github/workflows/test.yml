name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm run build
      - name: Run tests
        run: |
          set -euo pipefail
          node --import ./test/setup.ts --test --test-concurrency=1 test/*.test.ts 2>&1 | tee "$RUNNER_TEMP/bound-tests.log"
      - name: Check public source closure
        run: node dist/cli/verb.js fold --check
      - name: Form exact archive once
        if: matrix.node == 24
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/exact/history" "$RUNNER_TEMP/package-stage"
          npm pack --dry-run --json --ignore-scripts | jq -r '.[0].files[].path' | LC_ALL=C sort > "$RUNNER_TEMP/npm-members"
          jq -r '.[]' .publication-members.json | LC_ALL=C sort > "$RUNNER_TEMP/admitted-members"
          cmp "$RUNNER_TEMP/npm-members" "$RUNNER_TEMP/admitted-members"
          jq -j '.[] + "\u0000"' .publication-members.json > "$RUNNER_TEMP/package-members"
          rsync -a --from0 --files-from="$RUNNER_TEMP/package-members" ./ "$RUNNER_TEMP/package-stage/"
          node dist/cli/verb.js fold --as evidence > "$RUNNER_TEMP/exact/evidence.bound"
          for record in TARGET.bound receipts.bound "$RUNNER_TEMP/exact/evidence.bound"; do
            digest="$(sha256sum "$record" | cut -d ' ' -f1)"
            cp "$record" "$RUNNER_TEMP/exact/history/$digest.bound"
          done
          node dist/cli/verb.js fold --as publication-lines > "$RUNNER_TEMP/package-stage/TARGET.bound"
          node dist/cli/verb.js fold --as publication-receipts > "$RUNNER_TEMP/package-stage/receipts.bound"
          (cd "$RUNNER_TEMP/package-stage" && node "$GITHUB_WORKSPACE/dist/cli/verb.js" fold --check)
          (cd "$RUNNER_TEMP/package-stage" && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/exact")
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: bound-exact-archive
          path: ${{ runner.temp }}/exact/lapxo-bound-0.2.7.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: bound-publication-history
          path: ${{ runner.temp }}/exact/history/*.bound
          if-no-files-found: error
      - name: Preserve test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bound-node-${{ matrix.node }}
          path: ${{ runner.temp }}/bound-tests.log
          if-no-files-found: ignore
  exact_archive:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      archive_digest: ${{ steps.identity.outputs.archive_digest }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bound-exact-archive
          path: .exact-input
      - id: identity
        run: printf 'archive_digest=sha256:%s\n' "$(sha256sum .exact-input/lapxo-bound-0.2.7.tgz | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
  portability-ci:
    needs: exact_archive
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - uses: actions/download-artifact@v4
        with:
          name: bound-exact-archive
          path: .portability-input
      - name: Check installed archive and native attestation
        run: node --experimental-strip-types --test test/portability-installed.test.ts
        env:
          BOUND_PORTABILITY_ARCHIVE: .portability-input/lapxo-bound-0.2.7.tgz
          BOUND_PORTABILITY_DIGEST: ${{ needs.exact_archive.outputs.archive_digest }}
          BOUND_PORTABILITY_CAPTURE: ${{ runner.temp }}/portability-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portability-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/portability-evidence.json
          if-no-files-found: error
