name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Verify native closure and receipt reuse
        run: |
          node dist/cli/verb.js fold --check > "$RUNNER_TEMP/bound-check.log" 2>&1 || { cat "$RUNNER_TEMP/bound-check.log"; exit 1; }
          cat "$RUNNER_TEMP/bound-check.log"
          grep -Eq '^PASS +closed' "$RUNNER_TEMP/bound-check.log"
          grep -Eq '^RECEIPTS [1-9][0-9]* read · 0 opened' "$RUNNER_TEMP/bound-check.log"
      - run: npm pack --silent
