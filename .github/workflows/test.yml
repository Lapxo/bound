name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm run build
      - name: Run tests
        run: |
          set -euo pipefail
          node --import ./test/setup.ts --test --test-concurrency=1 test/*.test.ts 2>&1 | tee "$RUNNER_TEMP/bound-tests.log"
      - name: Form package from clean PR checkout
        if: matrix.node == 24 && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/pr-package"
          npm pack --offline --ignore-scripts --pack-destination "$RUNNER_TEMP"
          npm run compact-archive -- "$RUNNER_TEMP/lapxo-bound-0.2.9.tgz" "$RUNNER_TEMP/pr-package/lapxo-bound-0.2.9.tgz"
          cd "$RUNNER_TEMP/pr-package"
          sha256sum lapxo-bound-0.2.9.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24 && github.event_name == 'pull_request'
        with:
          name: bound-pr-package
          path: ${{ runner.temp }}/pr-package/
          if-no-files-found: error
      - name: Form exact archive once
        if: matrix.node == 24 && github.event_name == 'push'
        run: |
          mkdir "$RUNNER_TEMP/exact"
          npm run compact-archive -- --from-place . "$RUNNER_TEMP/exact/lapxo-bound-0.2.9.tgz"
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24 && github.event_name == 'push'
        with:
          name: bound-exact-archive
          path: ${{ runner.temp }}/exact/lapxo-bound-0.2.9.tgz
          if-no-files-found: error
      - name: Preserve test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bound-node-${{ matrix.node }}
          path: ${{ runner.temp }}/bound-tests.log
          if-no-files-found: ignore
  pr-package-portability:
    if: github.event_name == 'pull_request'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: bound-pr-package
          path: .pr-package
      - name: Verify and install the same PR package
        run: node --experimental-strip-types test/check-clean-clone-package.ts .pr-package
  exact_archive:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      archive_digest: ${{ steps.identity.outputs.archive_digest }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bound-exact-archive
          path: .exact-input
      - id: identity
        run: printf 'archive_digest=sha256:%s\n' "$(sha256sum .exact-input/lapxo-bound-0.2.9.tgz | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
  portability-ci:
    needs: exact_archive
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - uses: actions/download-artifact@v4
        with:
          name: bound-exact-archive
          path: .portability-input
      - name: Check installed archive and native attestation
        run: node --experimental-strip-types --test test/portability-installed.test.ts
        env:
          BOUND_PORTABILITY_ARCHIVE: .portability-input/lapxo-bound-0.2.9.tgz
          BOUND_PORTABILITY_DIGEST: ${{ needs.exact_archive.outputs.archive_digest }}
          BOUND_PORTABILITY_CAPTURE: ${{ runner.temp }}/portability-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portability-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/portability-evidence.json
          if-no-files-found: error
