<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">One history, several views</title><desc id="desc">Illustrative spatial view of B, C, G and independent D. C rests on B and G rests on C. B's travelling ceiling is 0 to 50 and travelling floor 40 to 100. Its local join widens only B to 0 to 100. Region receipts retain selected topos and implementation identity. Background points are decorative, not additional measured cells.</desc>
<defs>
<radialGradient id="bg"><stop stop-color="#163445"/><stop offset="1" stop-color="#080f1c"/></radialGradient>
<radialGradient id="dot"><stop stop-color="#fff"/><stop offset=".4" stop-color="#b4f8ed"/><stop offset="1" stop-color="#2c8c9a"/></radialGradient>
<linearGradient id="edge"><stop stop-color="#62d9c4"/><stop offset="1" stop-color="#8da4ef"/></linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="12"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#7ce4d1"/></marker>
</defs>
