<rect width="1200" height="760" rx="24" fill="url(#bg)"/>
<text x="64" y="68" class="small" letter-spacing="3">THE ALGEBRA IN 60 SECONDS</text>
<text x="64" y="118" font-size="38" font-weight="600">One history. Several views.</text>
<text x="64" y="152" class="muted">A cell keeps its readings. A connection carries only what travels.</text>

