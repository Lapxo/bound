<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
<title id="title">Digest-selected topos: the target execution contract</title>
<desc id="desc">The proposed 0.1.0 workflow proceeds from an admitted uses declaration to bytes verified against a digest, a complete dependency closure, and execution in a compatible declared host. Missing bytes, unresolved dependencies, or incompatible hosts must refuse. Complete transitive execution without manual topos installation remains a release gate.</desc>
<style>
text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.kicker { fill:#91a1ac;font-size:12px;letter-spacing:2px;font-weight:600; }
.heading { fill:#edf1f3;font-size:29px;font-weight:600;letter-spacing:-.7px; }
.label { fill:#dce4e8;font-size:15px;font-weight:500; }
.note { fill:#aab8c1;font-size:12px; }
.mono { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; }
.pulse { animation: pulse 5s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity:.25; } 45%,65% { opacity:.85; } }
@media (prefers-reduced-motion:reduce) { .pulse,.flow { animation:none !important; } }
</style>
<style>.flow { stroke-dasharray:3 10; animation: travel 8s linear infinite; } @keyframes travel { to { stroke-dashoffset:-104; } }</style>
<defs><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141e26"/><stop offset="1" stop-color="#0b1117"/></linearGradient></defs>
<rect width="1000" height="350" rx="18" fill="url(#surface)"/>
<rect x=".5" y=".5" width="999" height="349" rx="17.5" fill="none" stroke="#2a3741"/>
<text x="42" y="40" class="kicker">BOUND / TOPOS</text>
<text x="42" y="84" class="heading">Choose a contract. Resolve its bytes.</text>
<text x="42" y="113" class="note">0.1.0 target contract · transitive closure is a pending release gate</text>
<g fill="#182630" stroke="#394d5b"><rect x="42" y="154" width="193" height="92" rx="10"/><rect x="282" y="154" width="193" height="92" rx="10"/><rect x="522" y="154" width="193" height="92" rx="10"/><rect x="762" y="154" width="196" height="92" rx="10"/></g>
<g fill="none" stroke="#648a87" stroke-width="2"><path d="M235 200H282M475 200H522M715 200H762"/><path d="m273 195 9 5-9 5m240-10 9 5-9 5m240-10 9 5-9 5"/></g>
<path d="M235 200H278M475 200H518M715 200H758" fill="none" stroke="#a1d0b9" stroke-width="2" class="flow"/>
<g class="label" text-anchor="middle"><text x="138" y="191" class="mono">uses</text><text x="378" y="191">Verified digest</text><text x="618" y="191">Complete closure</text><text x="860" y="191">Execution</text></g>
<g class="note" text-anchor="middle"><text x="138" y="221">Admitted selection</text><text x="378" y="221">Exact artifact bytes</text><text x="618" y="221">Pinned dependencies</text><text x="860" y="221">Declared compatible host</text></g>
<text x="42" y="289" class="label">Missing bytes or an unresolved contract → refuse with a cause.</text>
<text x="42" y="322" class="note">A digest identifies bytes. Authority admits their use. Neither establishes the safety or truth of execution.</text>
</svg>